name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0 or 1.0.0-rc.2). The leading "v" is added automatically.'
        required: true
        type: string

permissions:
  contents: read

env:
  PACKAGE_PATH: Aspid.Collections/Packages/tech.aspid.collections
  CHANGELOG_PATH: CHANGELOG.md

jobs:
  ci:
    uses: ./.github/workflows/tests.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Determine version
        id: version
        # Expressions go through env, never straight into the script: Actions substitutes them
        # before bash parses it, so a quote in the dispatch input would run as shell code.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$VERSION' is not a valid SemVer string."
            exit 1
          fi
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing $TAG"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify release commit is on main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::The release commit must be on main."
            exit 1
          fi

      - name: Check tag does not already exist
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists locally. Delete it or pick another version."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists on origin."
            exit 1
          fi

      - name: Validate package.json version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          PKG_VERSION=$(jq -r .version "$PACKAGE_PATH/package.json")
          if [[ "$PKG_VERSION" != "$VERSION" ]]; then
            echo "::error file=$PACKAGE_PATH/package.json::package.json version ($PKG_VERSION) does not match release version ($VERSION). Bump it before tagging."
            exit 1
          fi
          echo "package.json version matches: $PKG_VERSION"

      - name: Extract CHANGELOG section
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          NOTES=$(awk -v ver="$VERSION" '
            BEGIN { capture = 0 }
            /^## \[/ {
              if (capture) { exit }
              if ($0 ~ "^## \\[" ver "\\]([^0-9A-Za-z.-]|$)") { capture = 1; next }
            }
            capture { print }
          ' "$CHANGELOG_PATH")

          if [[ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]]; then
            echo "::error file=$CHANGELOG_PATH::No CHANGELOG section found for version $VERSION. Add a '## [$VERSION] — YYYY-MM-DD' heading before releasing."
            exit 1
          fi

          {
            echo "notes<<__CHANGELOG_EOF__"
            echo "$NOTES"
            echo "__CHANGELOG_EOF__"
          } >> "$GITHUB_OUTPUT"

          echo "CHANGELOG section for $VERSION extracted ($(echo "$NOTES" | wc -l) lines)."

      - name: Create and push release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Checkout release tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG" || true
          git checkout "$TAG"

      - name: Publish UPM tag and branch
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          UPM_TAG="upm/$VERSION"

          if git ls-remote --exit-code --tags origin "$UPM_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $UPM_TAG already exists on origin. Refusing to overwrite a published UPM tag."
            exit 1
          fi

          # Start the release tree at the embedded package root.
          UPM_INDEX=$(mktemp)
          trap 'rm -f "$UPM_INDEX"' EXIT
          export GIT_INDEX_FILE="$UPM_INDEX"
          git read-tree "$TAG:$PACKAGE_PATH"
          git ls-tree -rz "$TAG" -- "$CHANGELOG_PATH" LICENSE | git update-index -z --index-info
          for FILE in CHANGELOG.md LICENSE README.md README_RU.md; do
            META_BLOB=$(git rev-parse "$TAG:.github/upm/$FILE.meta")
            git update-index --add --cacheinfo "100644,$META_BLOB,$FILE.meta"
          done

          # Make code links package-relative and load images from the source tag.
          PACKAGE_PATH_PATTERN="${PACKAGE_PATH//./\\.}"
          README_IMAGE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${TAG}/Documentation~/Images/"
          for README_FILE in README.md README_RU.md; do
            README_BLOB=$(git show "$TAG:$README_FILE" \
              | sed -E -e "s|([\"(])${PACKAGE_PATH_PATTERN}/|\1|g" \
                  -e "s|([\"(])Documentation~/Images/|\1${README_IMAGE_URL}|g" \
              | git hash-object -w --stdin)
            git update-index --add --cacheinfo "100644,$README_BLOB,$README_FILE"
          done
          TREE=$(git write-tree)
          unset GIT_INDEX_FILE
          PARENT=$(git rev-parse "$TAG^{commit}")
          COMMIT=$(git commit-tree "$TREE" -p "$PARENT" -m "UPM release $VERSION")

          # Move the appropriate upm branch forward:
          # pre-releases → upm-preview, stable releases → upm.
          if [[ "$PRERELEASE" == "true" ]]; then
            UPM_BRANCH="upm-preview"
          else
            UPM_BRANCH="upm"
          fi
          # Publish the channel and its immutable version tag together.
          git push --atomic origin \
            "+$COMMIT:refs/heads/$UPM_BRANCH" \
            "$COMMIT:refs/tags/$UPM_TAG"

          echo "Published $UPM_TAG and updated $UPM_BRANCH branch."

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.changelog.outputs.notes }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
